<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Artesa · Hojas de producción</title>
<style>
  :root {
    --fondo: #f6f1ea; --panel: #fffdf9; --tinta: #2a2420; --tenue: #7a6f66; --linea: #e2d9cd;
    --acento: #1f5c7a; --acento-tinta: #fff; --ok: #2f7d4f; --ok-fondo: #e2f1e7;
    --pend-fondo: #f0e9df; --aviso: #8a5a00; --aviso-fondo: #fcefcf; --error: #a3302a; --error-fondo: #fbe4e1;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fondo: #1b1816; --panel: #25211e; --tinta: #efe8df; --tenue: #a69a8e; --linea: #3a342f;
      --acento: #6db4d6; --acento-tinta: #10222c; --ok: #7fd0a0; --ok-fondo: #1f3a2b;
      --pend-fondo: #322c27; --aviso: #f0c66a; --aviso-fondo: #3d3118; --error: #f19a93; --error-fondo: #43221f;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--fondo); color: var(--tinta); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { position: sticky; top: 0; z-index: 2; background: var(--panel); border-bottom: 1px solid var(--linea); }
  .barra { max-width: 860px; margin: auto; padding: 10px 16px 0; }
  .marca { font-weight: 700; letter-spacing: .12em; font-size: 14px; }
  .marca span { color: var(--tenue); font-weight: 400; letter-spacing: 0; margin-left: 8px; }
  nav { display: flex; gap: 4px; margin-top: 8px; }
  nav button { background: none; border: 0; border-bottom: 3px solid transparent; padding: 8px 14px; font: inherit; color: var(--tenue); cursor: pointer; }
  nav button[aria-selected=true] { color: var(--tinta); border-color: var(--acento); font-weight: 600; }
  main { max-width: 860px; margin: auto; padding: 16px; }
  .panel { background: var(--panel); border: 1px solid var(--linea); border-radius: 10px; padding: 16px; margin-bottom: 14px; }
  h2 { font-size: 17px; margin: 0 0 10px; }
  h3 { font-size: 14px; margin: 0 0 8px; text-transform: uppercase; letter-spacing: .06em; color: var(--tenue); }
  .boton { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: 8px;
    border: 1px solid var(--linea); background: var(--panel); color: var(--tinta); font: inherit; font-weight: 600; cursor: pointer; }
  .boton.primario { background: var(--acento); color: var(--acento-tinta); border-color: var(--acento); }
  .boton:disabled { opacity: .55; cursor: default; }
  .boton.mini { min-height: 34px; padding: 0 10px; font-weight: 500; font-size: 14px; }
  .acciones { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
  .captura { display: grid; gap: 12px; justify-items: start; }
  .captura p { margin: 0; color: var(--tenue); }
  .vista { max-width: 100%; max-height: 300px; border-radius: 8px; border: 1px solid var(--linea); display: block; margin-bottom: 12px; }
  #cola { list-style: none; margin: 0; padding: 0; width: 100%; display: grid; gap: 8px; }
  #cola li { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 8px; border: 1px solid var(--linea); border-radius: 8px; }
  #cola li.abierta { border-color: var(--acento); }
  #cola li.resumen { border: 0; padding: 0 2px; font-size: 14px; }
  #cola img { width: 52px; height: 52px; object-fit: cover; border-radius: 6px; }
  #cola .info { flex: 1; min-width: 130px; display: grid; gap: 3px; justify-items: start; font-size: 14px; }
  .chip.aviso { background: var(--aviso-fondo); color: var(--aviso); }
  .chip.mal { background: var(--error-fondo); color: var(--error); }
  .campos { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
  label { display: grid; gap: 3px; font-size: 13px; color: var(--tenue); }
  input { width: 100%; min-height: 40px; padding: 6px 9px; border: 1px solid var(--linea); border-radius: 6px; background: var(--fondo); color: var(--tinta); font: inherit; }
  input:focus-visible, button:focus-visible { outline: 2px solid var(--acento); outline-offset: 1px; }
  .ancho { grid-column: 1 / -1; }
  .articulo { border-top: 1px solid var(--linea); margin-top: 14px; padding-top: 14px; }
  .tabla { overflow-x: auto; margin-top: 10px; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th { text-align: left; font-weight: 600; color: var(--tenue); font-size: 12px; padding: 4px 6px; white-space: nowrap; }
  td { padding: 3px 4px; border-top: 1px solid var(--linea); }
  td input { min-width: 74px; }
  .lectura td { padding: 7px 6px; font-variant-numeric: tabular-nums; }
  .nota { border-radius: 8px; padding: 10px 12px; margin: 0 0 12px; font-size: 14px; }
  .nota ul { margin: 4px 0 0; padding-left: 18px; }
  .aviso { background: var(--aviso-fondo); color: var(--aviso); }
  .error { background: var(--error-fondo); color: var(--error); }
  .exito { background: var(--ok-fondo); color: var(--ok); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 99px; background: var(--pend-fondo); color: var(--tenue); }
  .chip.registrada { background: var(--ok-fondo); color: var(--ok); }
  .orden { display: block; width: 100%; text-align: left; font: inherit; color: inherit; cursor: pointer; }
  .orden .num { font-weight: 700; font-variant-numeric: tabular-nums; }
  .orden .sub { color: var(--tenue); font-size: 14px; }
  .fila { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .tenue { color: var(--tenue); }
  a { color: var(--acento); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <div class="barra">
    <div class="marca">ARTESA<span>Hojas de producción diaria</span></div>
    <nav role="tablist">
      <button role="tab" id="tab-capturar" aria-selected="true">Capturar</button>
      <button role="tab" id="tab-ordenes" aria-selected="false">Órdenes</button>
    </nav>
  </div>
</header>

<main>
  <form id="acceso" class="panel" hidden>
    <h2>Acceso</h2>
    <div id="acceso-error"></div>
    <label>Contraseña<input type="password" id="clave" autocomplete="current-password" required></label>
    <div class="acciones"><button class="boton primario">Entrar</button></div>
  </form>

  <section id="capturar">
    <div id="mensaje"></div>
    <div class="panel captura">
      <h2>Fotos de las hojas</h2>
      <p>Toma las fotos una tras otra, o carga varias de la galería. Cada hoja se lee sola mientras sigues con la siguiente.</p>
      <input type="file" id="camara" accept="image/*" capture="environment" hidden>
      <input type="file" id="galeria" accept="image/*" multiple hidden>
      <div class="acciones" style="margin-top:0">
        <button class="boton primario" id="tomar">Tomar foto</button>
        <button class="boton" id="cargar">Cargar varias</button>
      </div>
      <ul id="cola" aria-live="polite"></ul>
    </div>
    <form id="revision" hidden></form>
  </section>

  <section id="ordenes" hidden></section>
</main>

<script>
const $ = (s, r = document) => r.querySelector(s);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fechaCorta = (iso) => (iso ? iso.slice(0, 10).split("-").reverse().join("/") : "—");

let cola = [];      // fotos en curso: { id, url, imagen, mime, estado, datos, extraccion, yaRegistrada, error }
let actual = null;  // foto abierta en la revisión
let leyendo = 0;
let serie = 0;

async function api(ruta, cuerpo) {
  const r = await fetch(ruta, cuerpo ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(cuerpo) } : undefined);
  const datos = await r.json().catch(() => ({}));
  if (r.status === 401 && ruta !== "/api/entrar") pedirClave();
  if (!r.ok) throw new Error(datos.error || "Error " + r.status);
  return datos;
}

function mensaje(clase, html) {
  $("#mensaje").innerHTML = html ? `<div class="nota ${clase}" role="status">${html}</div>` : "";
}

// ---------- Acceso ----------
function pedirClave() {
  $("#acceso").hidden = false;
  $("#capturar").hidden = $("#ordenes").hidden = true;
  $("#clave").focus();
}
$("#acceso").onsubmit = async (e) => {
  e.preventDefault();
  try {
    await api("/api/entrar", { clave: $("#clave").value });
    $("#clave").value = "";
    $("#acceso-error").innerHTML = "";
    $("#acceso").hidden = true;
    mostrar("capturar");
  } catch (err) {
    $("#acceso-error").innerHTML = `<div class="nota error" role="alert">${esc(err.message)}</div>`;
  }
};
api("/api/sesion").then((s) => { if (!s.dentro) pedirClave(); }).catch(() => {});

// ---------- Pestañas ----------
function mostrar(pestana) {
  if (!$("#acceso").hidden) return;
  for (const p of ["capturar", "ordenes"]) {
    $("#" + p).hidden = p !== pestana;
    $("#tab-" + p).setAttribute("aria-selected", p === pestana);
  }
  if (pestana === "ordenes") listarOrdenes();
}
$("#tab-capturar").onclick = () => mostrar("capturar");
$("#tab-ordenes").onclick = () => mostrar("ordenes");

// ---------- Captura ----------
$("#tomar").onclick = () => $("#camara").click();
$("#cargar").onclick = () => $("#galeria").click();
$("#camara").onchange = $("#galeria").onchange = async (e) => {
  // El campo se vacía al final: en algunos celulares, vaciarlo antes invalida las fotos elegidas.
  await agregar([...e.target.files]);
  e.target.value = "";
};

function dibujar(fuente, ancho, alto) {
  const escala = Math.min(1, 2000 / Math.max(ancho, alto));
  const lienzo = document.createElement("canvas");
  lienzo.width = Math.round(ancho * escala);
  lienzo.height = Math.round(alto * escala);
  lienzo.getContext("2d").drawImage(fuente, 0, 0, lienzo.width, lienzo.height);
  const url = lienzo.toDataURL("image/jpeg", 0.85);
  if (url.length < 1000) throw new Error("la imagen quedó vacía");
  return { url, imagen: url.split(",")[1], mime: "image/jpeg" };
}

const comoImg = (url) => new Promise((ok, mal) => {
  const img = new Image();
  img.onload = () => ok(img);
  img.onerror = () => mal(new Error("formato no admitido por el navegador"));
  img.src = url;
});

// Se reduce en el navegador: basta para leer la letra y sube mucho más rápido.
// Hay tres caminos porque no todos los navegadores de celular abren las fotos igual.
// Las fotos HEIC (formato de muchas cámaras de celular) se convierten a JPEG antes de abrirlas.
let conversor;
const esHeic = (a) => /\.(heic|heif)$/i.test(a.name || "") || /hei[cf]/i.test(a.type || "");
async function deHeic(archivo) {
  conversor ??= new Promise((ok, mal) => {
    const s = document.createElement("script");
    s.src = "/vendor/heic-to.js";
    s.onload = ok;
    s.onerror = () => { conversor = null; mal(new Error("no se pudo descargar el conversor de fotos HEIC")); };
    document.head.append(s);
  });
  await conversor;
  try {
    return await HeicTo({ blob: archivo, type: "image/jpeg", quality: 0.9 });
  } catch {
    throw new Error("no se pudo convertir la foto HEIC");
  }
}

async function preparar(archivo) {
  if (!archivo.size) throw new Error("el archivo llegó vacío (¿foto en la nube sin descargar?)");
  if (esHeic(archivo)) archivo = await deHeic(archivo);
  try {
    const bmp = await createImageBitmap(archivo);
    try { return dibujar(bmp, bmp.width, bmp.height); } finally { bmp.close?.(); }
  } catch {}
  const blobUrl = URL.createObjectURL(archivo);
  try {
    const img = await comoImg(blobUrl);
    return dibujar(img, img.naturalWidth, img.naturalHeight);
  } catch (err) {
    // Último recurso: enviar la foto tal cual, si el servidor admite su formato y tamaño.
    if (!["image/jpeg", "image/png", "image/webp"].includes(archivo.type) || archivo.size > 4_500_000) throw err;
    const url = await new Promise((ok, mal) => {
      const lector = new FileReader();
      lector.onload = () => ok(lector.result);
      lector.onerror = () => mal(new Error("no se pudo leer el archivo"));
      lector.readAsDataURL(archivo);
    });
    return { url, imagen: url.split(",")[1], mime: archivo.type };
  } finally {
    URL.revokeObjectURL(blobUrl);
  }
}

async function agregar(archivos) {
  mensaje();
  const fallos = [];
  for (const [i, archivo] of archivos.entries()) {
    if (archivos.length > 1 || esHeic(archivo)) mensaje("aviso", `Preparando foto ${i + 1} de ${archivos.length}…`);
    try {
      cola.push({ id: ++serie, estado: "pendiente", ...(await preparar(archivo)) });
      pintarCola();
      procesar();
    } catch (err) { fallos.push(`${archivo.name || "foto"}: ${err.message}`); }
  }
  mensaje();
  if (fallos.length)
    mensaje("error", `No se ${fallos.length === 1 ? "pudo abrir una imagen" : `pudieron abrir ${fallos.length} imágenes`}.<ul>${fallos.map((f) => `<li>${esc(f)}</li>`).join("")}</ul>`);
}

// Lee hasta tres fotos a la vez.
// ---------- Lectura ----------
// "ia": el servidor lee la foto con la API de Claude. "local": el celular lee lo impreso con un OCR gratuito
// y lo manuscrito se escribe a mano.
let modo = null;
const config = () => (modo ??= api("/api/config").then((c) => c.lectura).catch(() => { modo = null; return "local"; }));

let lector;
function crearLector() {
  lector ??= (async () => {
    await new Promise((ok, mal) => {
      const s = document.createElement("script");
      s.src = "/vendor/tesseract/tesseract.min.js";
      s.onload = ok;
      s.onerror = () => mal(new Error("no se pudo descargar el lector de fotos"));
      document.head.append(s);
    });
    return Tesseract.createWorker("spa", 1, {
      workerPath: "/vendor/tesseract/worker.min.js",
      corePath: "/vendor/tesseract-core",
      langPath: "/vendor/tesseract-lang",
      gzip: true,
    });
  })().catch((err) => { lector = null; throw err; });
  return lector;
}

async function girada(url, grados) {
  const img = await comoImg(url);
  const lienzo = document.createElement("canvas");
  const lado = grados % 180 !== 0;
  lienzo.width = lado ? img.naturalHeight : img.naturalWidth;
  lienzo.height = lado ? img.naturalWidth : img.naturalHeight;
  const c = lienzo.getContext("2d");
  c.translate(lienzo.width / 2, lienzo.height / 2);
  c.rotate((grados * Math.PI) / 180);
  c.drawImage(img, -img.naturalWidth / 2, -img.naturalHeight / 2);
  return lienzo;
}

// Prueba los cuatro giros hasta dar con la cabecera de la hoja.
async function ocr(f) {
  const lector = await crearLector();
  let mejor = null;
  for (const grados of [0, 270, 90, 180]) {
    f.paso = `Leyendo… (giro ${grados}°)`;
    pintarCola();
    const { data } = await lector.recognize(await girada(f.url, grados));
    const puntos = (/PRODUC/i.test(data.text) ? 2 : 0) + (/ORDEN|SECCI/i.test(data.text) ? 1 : 0);
    if (!mejor || puntos > mejor.puntos || (puntos === mejor.puntos && data.confidence > mejor.c)) mejor = { puntos, c: data.confidence, texto: data.text };
    if (puntos >= 3) break;
  }
  return mejor.texto;
}

async function leerLocal(f) {
  const { interpretar } = await import("/lectura-local.js");
  const d = interpretar(await ocr(f));
  let yaRegistrada = null;
  // Si la orden ya está en la base (por otra sección), sus datos revisados valen más que lo leído.
  if (d.numero_orden) {
    const o = await api("/api/ordenes/" + encodeURIComponent(d.numero_orden)).catch(() => null);
    if (o) {
      d.fecha_emision = o.fecha_emision ?? d.fecha_emision;
      d.cliente = o.cliente ?? d.cliente;
      d.observaciones = o.observaciones ?? d.observaciones;
      if (o.articulos.length) {
        d.articulos = o.articulos.map((a) => ({
          codigo_bizcocho: a.codigo_bizcocho, bizcocho: a.bizcocho, codigo_decoracion: a.codigo_decoracion, decoracion: a.decoracion,
          cantidad_producir: a.cantidad_producir, tiempo_estandar: a.tiempo_estandar, ruta: a.ruta, malas: null, registros: [],
        }));
        d.dudas = d.dudas.filter((x) => !/artículos/.test(x) && !/fecha de emisión|cliente/.test(x));
        d.dudas.unshift("Orden ya conocida: cliente y artículos se tomaron de la base de datos.");
      }
      yaRegistrada = o.hojas.find((h) => h.estado === "registrada" && h.seccion === d.seccion)?.registrada_en ?? null;
    }
  }
  if (!d.articulos.length)
    d.articulos = [{ codigo_bizcocho: "", bizcocho: "", codigo_decoracion: "", decoracion: "", cantidad_producir: null, tiempo_estandar: null, ruta: null, malas: null, registros: [] }];
  for (const a of d.articulos) a.registros = [{}];
  d.dudas.push("Escribe a mano los operarios y, por cada día, la fecha, cantidad, horas y personas.");
  return { datos: d, ya_registrada: yaRegistrada };
}

async function leer(f) {
  return (await config()) === "local" ? leerLocal(f) : api("/api/extraer", { imagen: f.imagen, mime: f.mime });
}

// Con IA lee hasta tres fotos a la vez; el lector local, de una en una.
async function procesar() {
  const limite = (await config()) === "local" ? 1 : 3;
  while (leyendo < limite) {
    const f = cola.find((x) => x.estado === "pendiente");
    if (!f) return;
    f.estado = "leyendo";
    leyendo++;
    leer(f)
      .then((r) => {
        f.extraccion = r.datos;
        f.datos = r.datos;
        f.yaRegistrada = r.ya_registrada;
        f.estado = r.datos.es_hoja_produccion ? "lista" : "no_hoja";
      })
      .catch((err) => { f.estado = "error"; f.error = err.message; })
      .finally(() => {
        leyendo--;
        f.paso = null;
        pintarCola();
        if (!actual && f.estado === "lista") abrir(f.id, false);
        procesar();
      });
  }
  pintarCola();
}

const ESTADOS = {
  pendiente: ["En espera", ""], leyendo: ["Leyendo…", ""], lista: ["Por revisar", "aviso"],
  guardada: ["Guardada", "registrada"], no_hoja: ["No es una hoja", "mal"], error: ["Error", "mal"],
};

function pintarCola() {
  const porRevisar = cola.filter((f) => f.estado === "lista").length;
  $("#cola").innerHTML = cola.map((f) => {
    const [base, clase] = ESTADOS[f.estado];
    const texto = f.estado === "leyendo" && f.paso ? f.paso : base;
    const d = f.datos;
    const titulo = d?.numero_orden ? `Orden ${esc(d.numero_orden)} · ${esc(d.seccion ?? "")}` : `Foto ${f.id}`;
    return `<li class="${actual === f.id ? "abierta" : ""}" data-id="${f.id}">
      <img src="${f.url}" alt="">
      <div class="info"><strong>${titulo}</strong>
        <span class="chip ${clase}">${texto}</span>${f.estado === "error" ? `<span class="tenue"> ${esc(f.error)}</span>` : ""}</div>
      ${f.estado === "lista" && actual !== f.id ? `<button type="button" class="boton mini" data-a="abrir">Revisar</button>` : ""}
      ${f.estado === "error" ? `<button type="button" class="boton mini" data-a="reintentar">Reintentar</button>` : ""}
      ${f.estado !== "leyendo" ? `<button type="button" class="boton mini" data-a="quitar" aria-label="Quitar foto ${f.id}">Quitar</button>` : ""}
    </li>`;
  }).join("") + (cola.length > 1 ? `<li class="resumen tenue">${cola.length} fotos · ${porRevisar} por revisar · ${cola.filter((f) => f.estado === "guardada").length} guardadas</li>` : "");
}

$("#cola").onclick = (e) => {
  const accion = e.target.dataset.a;
  const id = Number(e.target.closest("li")?.dataset.id);
  const f = cola.find((x) => x.id === id);
  if (!accion || !f) return;
  if (accion === "abrir") abrir(id, true);
  if (accion === "reintentar") { f.estado = "pendiente"; procesar(); }
  if (accion === "quitar") {
    cola = cola.filter((x) => x.id !== id);
    if (actual === id) cerrarRevision();
    pintarCola();
  }
};

function abrir(id, desplazar) {
  if (actual && actual !== id) guardarEdicion();
  const f = cola.find((x) => x.id === id);
  actual = id;
  pintarCola();
  pintarRevision(f.datos, f.yaRegistrada, f.url, desplazar);
}

// Conserva lo corregido si se cambia de hoja antes de guardar.
function guardarEdicion() {
  const f = cola.find((x) => x.id === actual);
  if (f && f.estado === "lista") f.datos = { ...f.datos, ...leerRevision(), dudas: f.datos.dudas };
}

function cerrarRevision() {
  actual = null;
  $("#revision").hidden = true;
}

// ---------- Revisión ----------
const campo = (etiqueta, nombre, valor, extra = "") =>
  `<label>${etiqueta}<input name="${nombre}" value="${esc(valor)}" ${extra}></label>`;

const filaRegistro = (r = {}) => `
  <tr class="registro">
    <td><input type="date" data-c="fecha" value="${esc(r.fecha)}" aria-label="Fecha"></td>
    <td><input type="number" min="0" inputmode="numeric" data-c="cantidad" value="${esc(r.cantidad)}" aria-label="Cantidad"></td>
    <td><input type="time" data-c="hora_inicio" value="${esc(r.hora_inicio)}" aria-label="Hora de inicio"></td>
    <td><input type="time" data-c="hora_fin" value="${esc(r.hora_fin)}" aria-label="Hora de fin"></td>
    <td><input type="number" min="0" inputmode="numeric" data-c="personas" value="${esc(r.personas)}" aria-label="Personas"></td>
    <td><button type="button" class="boton mini quitar" aria-label="Quitar registro">Quitar</button></td>
  </tr>`;

function pintarRevision(d, yaRegistrada, url, desplazar) {
  const avisos = [];
  if (yaRegistrada) avisos.push(`<div class="nota aviso">Esta orden y sección ya se registraron el ${fechaCorta(yaRegistrada)}. Si guardas, se reemplaza el registro anterior.</div>`);
  if (d.dudas?.length) avisos.push(`<div class="nota aviso"><strong>Revisa estos datos:</strong><ul>${d.dudas.map((x) => `<li>${esc(x)}</li>`).join("")}</ul></div>`);

  $("#revision").innerHTML = `
    <div class="panel">
      <h2>Revisa y corrige</h2>
      <img class="vista" src="${url}" alt="Foto de la hoja">
      ${avisos.join("")}
      <div class="campos">
        ${campo("Orden #", "numero_orden", d.numero_orden, "required")}
        ${campo("Sección", "seccion", d.seccion, "required")}
        ${campo("Fecha de emisión", "fecha_emision", d.fecha_emision, 'type="date"')}
        ${campo("Operario 1", "operario1", d.operario1)}
        ${campo("Operario 2", "operario2", d.operario2)}
        ${campo("Cliente", "cliente", d.cliente)}
        ${campo("Observaciones", "observaciones", d.observaciones)}
        <div class="ancho">${campo("Notas (anotaciones a mano fuera de la tabla)", "notas", d.notas)}</div>
      </div>
      ${d.articulos.map((a) => `
        <div class="articulo">
          <h3>Artículo</h3>
          <div class="campos">
            ${campo("Código de bizcocho", "codigo_bizcocho", a.codigo_bizcocho, 'inputmode="numeric"')}
            ${campo("Bizcocho", "bizcocho", a.bizcocho)}
            ${campo("Código de decoración", "codigo_decoracion", a.codigo_decoracion, 'inputmode="numeric"')}
            ${campo("Decoración", "decoracion", a.decoracion)}
            ${campo("Producir", "cantidad_producir", a.cantidad_producir, 'type="number" min="0" inputmode="numeric"')}
            ${campo("Tiempo", "tiempo_estandar", a.tiempo_estandar, 'type="number" min="0" step="0.01" inputmode="decimal"')}
            ${campo("Ruta", "ruta", a.ruta)}
            ${campo("Malas", "malas", a.malas, 'type="number" min="0" inputmode="numeric"')}
          </div>
          <div class="tabla">
            <table>
              <thead><tr><th>Fecha</th><th>Cant.</th><th>Inicio</th><th>Fin</th><th>Pers.</th><th></th></tr></thead>
              <tbody>${(a.registros ?? []).map(filaRegistro).join("")}</tbody>
            </table>
          </div>
          <button type="button" class="boton mini agregar" style="margin-top:8px">Añadir registro</button>
        </div>`).join("")}
      <div class="acciones">
        <button class="boton primario" id="guardar">Guardar hoja</button>
      </div>
    </div>`;
  $("#revision").hidden = false;
  if (desplazar) $("#revision").scrollIntoView({ behavior: "smooth", block: "start" });
}

$("#revision").onclick = (e) => {
  if (e.target.matches(".quitar")) e.target.closest("tr").remove();
  if (e.target.matches(".agregar")) $("tbody", e.target.closest(".articulo")).insertAdjacentHTML("beforeend", filaRegistro());
};

function leerRevision() {
  const f = $("#revision");
  const valor = (raiz, nombre) => $(`[name=${nombre}]`, raiz).value.trim();
  const datos = {};
  for (const n of ["numero_orden", "seccion", "fecha_emision", "operario1", "operario2", "cliente", "observaciones", "notas"]) datos[n] = valor(f, n);
  datos.articulos = [...f.querySelectorAll(".articulo")].map((el) => {
    const a = {};
    for (const n of ["codigo_bizcocho", "bizcocho", "codigo_decoracion", "decoracion", "cantidad_producir", "tiempo_estandar", "ruta", "malas"]) a[n] = valor(el, n);
    a.registros = [...el.querySelectorAll(".registro")].map((tr) =>
      Object.fromEntries([...tr.querySelectorAll("[data-c]")].map((i) => [i.dataset.c, i.value])));
    return a;
  });
  return datos;
}

$("#revision").onsubmit = async (e) => {
  e.preventDefault();
  const f = cola.find((x) => x.id === actual);
  const boton = $("#guardar");
  boton.disabled = true;
  boton.textContent = "Guardando…";
  try {
    const datos = leerRevision();
    await api("/api/hojas", { datos, extraccion: f.extraccion, imagen: f.imagen, mime: f.mime });
    f.estado = "guardada";
    f.datos = { ...f.datos, ...datos };
    f.imagen = null;
    cerrarRevision();
    const siguiente = cola.find((x) => x.estado === "lista");
    mensaje("exito", `Hoja guardada: orden ${esc(datos.numero_orden)}, sección ${esc(datos.seccion)}.` +
      (siguiente ? " Sigue con la siguiente." : ""));
    if (siguiente) abrir(siguiente.id, true);
    else { pintarCola(); window.scrollTo({ top: 0, behavior: "smooth" }); }
  } catch (err) {
    mensaje("error", esc(err.message));
    window.scrollTo({ top: 0, behavior: "smooth" });
    boton.disabled = false;
    boton.textContent = "Guardar hoja";
  }
};

// ---------- Órdenes ----------
const chips = (secciones) => `<div class="chips">${secciones.map((s) =>
  `<span class="chip ${s.estado}">${esc(s.seccion)} · ${s.estado === "registrada" ? "registrada" : "pendiente"}</span>`).join("")}</div>`;

async function listarOrdenes() {
  const cont = $("#ordenes");
  cont.innerHTML = `<p class="tenue">Cargando…</p>`;
  try {
    const ordenes = await api("/api/ordenes");
    cont.innerHTML = ordenes.length
      ? ordenes.map((o) => `
          <button class="panel orden" data-numero="${esc(o.numero)}">
            <div class="fila"><span class="num">Orden ${esc(o.numero)}</span><span class="sub">${fechaCorta(o.fecha_emision)}</span></div>
            <div class="sub">${esc(o.articulos ?? "")}${o.cliente ? " — " + esc(o.cliente) : ""}</div>
            ${chips(o.secciones)}
          </button>`).join("")
      : `<div class="panel"><p class="tenue" style="margin:0">Todavía no hay órdenes. Captura la primera hoja en la pestaña Capturar.</p></div>`;
  } catch (err) {
    cont.innerHTML = `<div class="nota error">${esc(err.message)}</div>`;
  }
}

$("#ordenes").onclick = async (e) => {
  if (e.target.closest("#volver")) return listarOrdenes();
  const tarjeta = e.target.closest(".orden");
  if (!tarjeta) return;
  const cont = $("#ordenes");
  try {
    const o = await api("/api/ordenes/" + encodeURIComponent(tarjeta.dataset.numero));
    const nombreArt = (id) => { const a = o.articulos.find((x) => x.id === id); return a ? `${a.bizcocho} ${a.decoracion}`.trim() : ""; };
    cont.innerHTML = `
      <button class="boton mini" id="volver" style="margin-bottom:12px">← Órdenes</button>
      <div class="panel">
        <div class="fila"><h2>Orden ${esc(o.numero)}</h2><span class="tenue">${fechaCorta(o.fecha_emision)}</span></div>
        <div class="tenue">${esc(o.cliente ?? "")}${o.observaciones ? " · " + esc(o.observaciones) : ""}</div>
        <div class="tabla"><table class="lectura">
          <thead><tr><th>Cód.</th><th>Bizcocho</th><th>Cód.</th><th>Decoración</th><th>Producir</th><th>Tiempo</th><th>Ruta</th></tr></thead>
          <tbody>${o.articulos.map((a) => `<tr><td>${esc(a.codigo_bizcocho)}</td><td>${esc(a.bizcocho)}</td><td>${esc(a.codigo_decoracion)}</td><td>${esc(a.decoracion)}</td>
            <td>${esc(a.cantidad_producir ?? "—")}</td><td>${esc(a.tiempo_estandar ?? "—")}</td><td>${esc(a.ruta ?? "—")}</td></tr>`).join("")}</tbody>
        </table></div>
      </div>
      ${o.hojas.map((h) => `
        <div class="panel">
          <div class="fila">
            <h2>${esc(h.seccion)}</h2>
            <span class="chip ${h.estado}">${h.estado === "registrada" ? "registrada" : "pendiente"}</span>
          </div>
          ${h.estado !== "registrada" ? `<p class="tenue" style="margin:0">Falta la hoja de esta sección.</p>` : `
            <div class="tenue">${esc([h.operario1, h.operario2].filter(Boolean).join(" y ") || "Sin operario")}${h.tiene_foto ? ` · <a href="/api/hojas/${h.id}/foto" target="_blank" rel="noopener">Ver foto</a>` : ""}</div>
            ${h.notas ? `<div class="tenue">Notas: ${esc(h.notas)}</div>` : ""}
            <div class="tabla"><table class="lectura">
              <thead><tr><th>Artículo</th><th>Fecha</th><th>Cant.</th><th>Inicio</th><th>Fin</th><th>Pers.</th></tr></thead>
              <tbody>${h.articulos.flatMap((a) => a.registros.map((r) => `<tr><td>${esc(nombreArt(a.articulo_id))}</td><td>${fechaCorta(r.fecha)}</td>
                <td>${esc(r.cantidad ?? "—")}</td><td>${esc(r.hora_inicio ?? "—")}</td><td>${esc(r.hora_fin ?? "—")}</td><td>${esc(r.personas ?? "—")}</td></tr>`)).join("")
                || `<tr><td colspan="6" class="tenue">Sin registros</td></tr>`}</tbody>
            </table></div>
            ${h.articulos.some((a) => a.malas != null) ? `<div class="tenue" style="margin-top:6px">Malas: ${h.articulos.filter((a) => a.malas != null).map((a) => `${esc(nombreArt(a.articulo_id))} ${a.malas}`).join(", ")}</div>` : ""}`}
        </div>`).join("")}`;
    window.scrollTo({ top: 0 });
  } catch (err) {
    cont.innerHTML = `<div class="nota error">${esc(err.message)}</div>`;
  }
};
</script>
</body>
</html>
